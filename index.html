<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="converter-card">
    <h1>Unit Converter</h1>
    <div class="input-group">
      <label for="inputValue">Value</label>
      <input type="number" id="inputValue" placeholder="Enter a number..." step="any">
    </div>
    <div class="input-group">
      <label for="conversionType">Conversion</label>
      <select id="conversionType">
        <option value="gal-L">Gallons to Liters (gal to L)</option>
        <option value="L-gal">Liters to Gallons (L to gal)</option>
        <option value="m-km">Meters to Kilometers (m to km)</option>
        <option value="km-m">Kilometers to Meters (km to m)</option>
        <option value="oz-g">Ounces to Grams (oz to g)</option>
        <option value="g-oz">Grams to Ounces (g to oz)</option>
        <option value="lbs-kg">Pounds to Kilograms (lbs to kg)</option>
        <option value="kg-lbs">Kilograms to Pounds (kg to lbs)</option>
      </select>
    </div>
    <div class="result-box">
      <span class="result-label">Result</span>
      <div id="resultOutput" class="result-value">---</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
