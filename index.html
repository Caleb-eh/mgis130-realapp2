<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitPulse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <h1>HabitPulse</h1>
      <p class="subtitle">Track daily habits & build streaks</p>
    </header>

    <section class="stats-card">
      <div class="stat-item">
        <span id="completed-count" class="stat-value">0</span>
        <span class="stat-label">Done Today</span>
      </div>
      <div class="stat-item">
        <span id="total-count" class="stat-value">0</span>
        <span class="stat-label">Total Habits</span>
      </div>
      <div class="stat-item">
        <span id="best-streak" class="stat-value">0d</span>
        <span class="stat-label">Best Streak</span>
      </div>
    </section>

    <form id="habit-form" class="habit-form">
      <input 
        type="text" 
        id="habit-input" 
        placeholder="Add a new habit..." 
        required 
        maxlength="40"
        aria-label="New habit name"
      />
      <button type="submit" id="add-btn">Add</button>
    </form>

    <section class="habit-section">
      <h2>Your Habits</h2>
      <ul id="habit-list" class="habit-list"></ul>
      <div id="empty-state" class="empty-state">
        No habits added yet. Create one above to get started!
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
